name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/app/errors.py"
      - "backend/app/knowledge/**"
      - "backend/app/analysis/name_forms.py"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/app/errors.py"
      - "backend/app/knowledge/**"
      - "backend/app/analysis/name_forms.py"
      - ".github/workflows/frontend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run e2e:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: output/playwright
          retention-days: 7
