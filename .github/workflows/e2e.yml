name: e2e

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - ".github/workflows/e2e.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: docker compose up -d --build --wait
        working-directory: .
        env:
          APP_COMMIT: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e:docker
      - run: docker compose logs --no-color > ../output-compose.log
        if: failure()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-server
          path: |
            output/playwright/server-results
            output-compose.log
          retention-days: 7
