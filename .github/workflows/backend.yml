name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/src/data/catalog.json"
      - "frontend/e2e/**"
      - "frontend/e2e-server/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/data/catalog.json"
      - "frontend/e2e/**"
      - "frontend/e2e-server/**"
      - ".github/workflows/backend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: upgrade
          POSTGRES_PASSWORD: upgrade
          POSTGRES_DB: upgrade
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U upgrade"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_ADMIN_URL: postgresql+asyncpg://upgrade:upgrade@localhost:5433/upgrade
      TEST_DATABASE_URL: postgresql+asyncpg://upgrade:upgrade@localhost:5433/upgrade_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
