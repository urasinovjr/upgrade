[project]
name = "upgrade-provider-sim"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.150.0,<1",
    "uvicorn>=0.54.0,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
