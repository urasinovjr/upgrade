services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: upgrade
      POSTGRES_PASSWORD: upgrade
      POSTGRES_DB: upgrade
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upgrade -d upgrade"]
      interval: 2s
      timeout: 3s
      retries: 30

  provider-sim:
    build: ./provider_sim
    ports:
      - "127.0.0.1:8011:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    image: upgrade-backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://upgrade:upgrade@db:5432/upgrade
      PROVIDER_URL: http://provider-sim:8001
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      provider-sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    image: upgrade-backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://upgrade:upgrade@db:5432/upgrade
      PROVIDER_URL: http://provider-sim:8001
    depends_on:
      api:
        condition: service_healthy
