name: upgrade

services:
  db:
    image: postgres:17-alpine
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: upgrade
      POSTGRES_PASSWORD: upgrade
      POSTGRES_DB: upgrade
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upgrade -d upgrade"]
      interval: 2s
      timeout: 3s
      retries: 30

  provider-sim:
    build: ./backend/provider_sim
    ports:
      - "127.0.0.1:8011:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -volume.max=100 -master.volumeSizeLimitMB=64
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    image: upgrade-backend
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips='*'"
    environment: &backend-environment
      DATABASE_URL: postgresql+asyncpg://upgrade:upgrade@db:5432/upgrade
      PROVIDER_URL: http://provider-sim:8001
      S3_ENDPOINT_URL: http://s3:8333
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PUBLIC_URL: http://127.0.0.1:8080
      ALLOWED_ORIGINS: '["http://127.0.0.1:8080", "http://localhost:8080", "http://127.0.0.1:5173", "http://localhost:5173"]'
      TERMS_URL: http://127.0.0.1:8080/legal/terms
      PERSONAL_DATA_URL: http://127.0.0.1:8080/legal/personal-data
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      provider-sim:
        condition: service_healthy
      s3:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    image: upgrade-backend
    command: python -m app.worker
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: upgrade-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db_data:
  s3_data:
