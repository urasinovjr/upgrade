<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Редактор формулы</title>
  </head>
  <body>
    <h1>Редактор формулы</h1>
    <div id="root"></div>
    <script type="module">
      import React, { useState } from "react";
      import { createRoot } from "react-dom/client";
      import { FormulaInput } from "/src/shared/math.tsx";
      import "/src/ui/styles/math.css";
      function Example() {
        const [value, setValue] = useState("");
        const [disabled, setDisabled] = useState(false);
        const [mounted, setMounted] = useState(true);
        return React.createElement(
          React.Fragment,
          null,
          React.createElement(
            "button",
            { onClick: () => setDisabled(!disabled) },
            "Доступность ввода",
          ),
          React.createElement("input", { "aria-label": "До формулы" }),
          mounted &&
            React.createElement(FormulaInput, {
              value,
              onChange: setValue,
              label: "Формула",
              disabled,
            }),
          React.createElement("input", { "aria-label": "После формулы" }),
          React.createElement("button", { onClick: () => setMounted(!mounted) }, "Показать поле"),
        );
      }
      createRoot(document.getElementById("root")).render(React.createElement(Example));
    </script>
  </body>
</html>
