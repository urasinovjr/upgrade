worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;
    client_body_timeout 60s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 'ok'; }
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
            try_files $uri =404;
        }
        location / { return 308 https://$host$request_uri; }
    }

    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        server_name _;
        ssl_certificate /etc/upgrade/tls/fullchain.pem;
        ssl_certificate_key /etc/upgrade/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        root /usr/share/nginx/html;
        index index.html;
        include /etc/nginx/security-headers.conf;
        client_max_body_size 450m;

        location ~ /\. { return 404; }
        location ~* ^/api/(docs|redoc|openapi\.json)(/|$) { return 404; }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
        }

        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
