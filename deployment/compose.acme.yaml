name: upgrade-acme

services:
  challenge:
    image: nginx/nginx-unprivileged:1.30.6-alpine@sha256:c3fc8fa482be50ef709c6438eb1bc98d50dbfe5a9b48be90711b8814f4dfd701
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    ports: ["0.0.0.0:80:8080"]
    volumes:
      - ./nginx.acme.conf:/etc/nginx/nginx.conf:ro
      - ${UPGRADE_ACME_DIR:?Set the ACME webroot directory}:/var/www/acme:ro
